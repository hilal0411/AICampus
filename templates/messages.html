{% extends "base.html" %}

{% block title %} - Nachrichten{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto text-center text-gray-400 text-sm py-16">
  Dein Nachrichten-Verlauf öffnet sich oben rechts im
  <span class="text-gray-600 font-medium">Sprechblasen-Menü</span>.
  <p class="mt-2 text-xs">
    Tippt das Panel nicht auf?
    <button type="button" onclick="dmTogglePanel()" class="text-blue-600 hover:underline">
      Hier klicken
    </button>, um es zu öffnen.
  </p>
</div>
{% endblock %}
